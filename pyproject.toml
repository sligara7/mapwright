[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapwright"
version = "0.28.0"
description = "Domain-neutral procedural fantasy map & world generation: Voronoi terrain, hydraulic erosion, biomes, rivers, Markov place-names, and shaded-relief SVG."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anthony Sligar" }]
keywords = [
    "procedural-generation",
    "fantasy-map",
    "worldgen",
    "voronoi",
    "terrain",
    "erosion",
    "biomes",
    "ttrpg",
    "svg",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Atlas (hand-drawn / themed) rendering stamps PNG symbols → needs Pillow. The
# core stays numpy-only; install this extra for AtlasRenderer.
atlas = ["pillow>=10"]
# ruff is bounded on BOTH sides on purpose, and mapwright learned this the expensive
# way by NOT doing it. CI installs this extra fresh on every run, so the open-ended
# `ruff>=0.1` that used to sit here meant the lint gate silently adopted whatever ruff
# shipped that morning. On 2026-08-15 it did: main went red across all four interpreters
# with 121 findings — 72 UP, 19 RUF, 6 I, 4 PL — in files nobody had touched, because a
# newer ruff widened its DEFAULT rule set. dndwright hit this first (0.16.0), wrote the
# rule, and pinned; mapwright had not adopted it. The floor is 0.5 because the rule set
# below uses the `[tool.ruff.lint]` table; the ceiling keeps a new minor from moving the
# gate again without a commit saying so.
dev = [
    "pytest>=7.4",
    "ruff>=0.5,<0.17",
    "hypothesis>=6",
    "pillow>=10",
    # tomli is the 3.10 backport of stdlib tomllib (3.11+). tests/test_packaging_contract.py
    # reads pyproject.toml to assert the numpy-only and lint-gate rules; without it the check
    # would skip on 3.10 — the lowest version we claim to support, so the one where an
    # unguarded gate matters most. A check that cannot fail on a supported interpreter is
    # not a gate.
    "tomli>=2.0; python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/sligara7/mapwright"
Repository = "https://github.com/sligara7/mapwright"

[tool.hatch.build.targets.wheel]
packages = ["src/mapwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# State the enforced rule set EXPLICITLY rather than inheriting ruff's defaults.
# Inheriting means the gate's meaning is a property of whichever ruff CI happened to
# install, so a release that widens the defaults retroactively fails commits that were
# green when written — with findings in files the change never touched. That is not a
# hypothetical here: it is what put main red on 2026-08-15.
#
# These four are what this project has actually been enforcing (ruff's historical
# default): pyflakes plus the pycodestyle errors that catch real mistakes.
#
# The wider families were adopted DELIBERATELY on 2026-08-15, in their own commit on
# top of the pin above — which is the order this rule demands, and the opposite of
# having them arrive as a side effect of a dependency resolving forward.
#
# `PL` is deliberately NOT adopted: 259 findings, almost all magic-value-comparison in
# generation code where the constants ARE the algorithm. That is its own decision.
select = ["E4", "E7", "E9", "F", "I", "SIM", "UP", "RUF"]

ignore = [
    # Ambiguous-unicode in strings/docstrings/comments. This project's prose uses
    # en/em dashes and arrows on purpose (→ in docstrings, — in comments); flagging
    # them fights the house style rather than catching a defect. 35 findings, all
    # cosmetic, none in code.
    "RUF001", "RUF002", "RUF003",
    # `Union[...]` -> `X | Y` on the three module-level type ALIASES (LabelSpec,
    # TerrainField, ElevationHint). These are evaluated at RUNTIME rather than being
    # annotations, and the support floor is 3.10. ruff itself declines to autofix
    # them, which is the tell. The benefit is cosmetic and the risk lands on the
    # lowest interpreter we claim to support, so this one is declined on purpose.
    "UP007",
    # The following three are DECLINED FOR THIS PROJECT SPECIFICALLY, not deferred
    # out of laziness — each would edit generation or render code where deterministic
    # output is the product, and none of them is a defect:
    #
    #   RUF046  `int(round(x))` -> `round(x)`. WRONG HERE. Several of these sit on
    #           numpy scalars, and `round(np.float64)` returns a np.float64 while
    #           `int(round(...))` returns a Python int. Dropping the cast changes the
    #           TYPE flowing into geometry, dungeon and terrain, and this package's
    #           central promise is that a seed reproduces byte-identical output.
    #   RUF005  tuple/list concatenation -> unpacking, in the atlas renderer's colour
    #           paths and one settlement ring splice. Equivalent, purely cosmetic, and
    #           touching a hot loop for style is not a trade worth making.
    #   RUF012  mutable class default in svg_renderer. A real observation, but fixing
    #           it changes class semantics and deserves its own commit and its own
    #           reasoning rather than riding along in a lint sweep.
    "RUF046", "RUF005", "RUF012",
]
